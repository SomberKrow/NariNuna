<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">Nari's Haven at the golden edge of evening</title>
  <desc id="desc">An original illustrated room with a sunset window, velvet curtains, autumn leaves, warm lamps, lavender, books, a pillow fort, and small friendly Ghosties.</desc>
  <defs>
    <linearGradient id="walls" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#39233e"/><stop offset=".56" stop-color="#211725"/><stop offset="1" stop-color="#17121d"/></linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#c597cc"/><stop offset=".5" stop-color="#edaf97"/><stop offset="1" stop-color="#f3cb8c"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#46303b"/><stop offset="1" stop-color="#241922"/></linearGradient>
    <radialGradient id="lamp"><stop stop-color="#f8c782" stop-opacity=".7"/><stop offset=".36" stop-color="#e8a064" stop-opacity=".18"/><stop offset="1" stop-color="#e8a064" stop-opacity="0"/></radialGradient>
    <radialGradient id="windowGlow"><stop stop-color="#ffd59f" stop-opacity=".33"/><stop offset="1" stop-color="#ffd59f" stop-opacity="0"/></radialGradient>
    <pattern id="wood" width="108" height="118" patternUnits="userSpaceOnUse"><path d="M0 117H108M107 0V118" stroke="#9e7185" stroke-opacity=".12"/></pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="32"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#120a14" flood-opacity=".42"/></filter>
    <g id="star"><path d="M0-9 3-3 9 0 3 3 0 9-3 3-9 0-3-3Z"/></g>
    <g id="ghost"><path d="M0 43C0 17 13 0 33 0s33 17 33 43v43l-12-9-10 9-11-9-11 9-10-9L0 86Z" fill="#f5ebf0"/><circle cx="23" cy="38" r="3.5" fill="#39243a"/><circle cx="44" cy="38" r="3.5" fill="#39243a"/><path d="M27 51q6 6 12 0" fill="none" stroke="#d697aa" stroke-width="3" stroke-linecap="round"/></g>
  </defs>
  <rect width="1800" height="1100" fill="url(#walls)"/>
  <ellipse cx="1278" cy="462" rx="695" ry="565" fill="url(#windowGlow)"/>
  <rect y="735" width="1800" height="365" fill="url(#floor)"/>
  <rect y="735" width="1800" height="365" fill="url(#wood)"/>
  <path d="M0 737H1800" stroke="#a27b82" stroke-opacity=".28" stroke-width="5"/>

  <!-- Deep arched sunset window. -->
  <g filter="url(#shadow)">
    <path d="M838 663V239c0-183 168-277 337-277s337 94 337 277v424Z" fill="#241a29" stroke="#a27879" stroke-width="12"/>
    <path d="M861 644V242c0-164 158-252 314-252s314 88 314 252v402Z" fill="url(#sky)"/>
    <path d="M863 552q131-76 261-36t214-66q89-62 151-54v248H861Z" fill="#8a6682" opacity=".75"/>
    <path d="M861 597q157-49 272-14t211-54q102-90 145-45v160H861Z" fill="#54405f"/>
    <circle cx="1305" cy="255" r="74" fill="#fff0c0" opacity=".86"/>
    <path d="M1175 11v634M862 339h627" stroke="#48313e" stroke-width="20"/>
    <path d="M857 648h637" stroke="#b18679" stroke-width="17" stroke-linecap="round"/>
  </g>

  <!-- Velvet curtains and trailing string lights. -->
  <path d="M782 83q51-24 104-19l-29 583q-39 43-81 0Z" fill="#755078"/>
  <path d="M1489 67q60-2 99 15l13 567q-44 42-95 0Z" fill="#755078"/>
  <path d="M791 171q33 54 64 13M1508 186q39 46 72 3" fill="none" stroke="#c89191" stroke-width="9"/>
  <path d="M155 171q178 84 350 16t336-18" fill="none" stroke="#d2ad8c" stroke-width="3"/>
  <g fill="#ffd293"><circle cx="192" cy="184" r="6"/><circle cx="264" cy="204" r="7"/><circle cx="337" cy="211" r="6"/><circle cx="410" cy="207" r="7"/><circle cx="486" cy="189" r="6"/><circle cx="559" cy="172" r="7"/><circle cx="635" cy="162" r="6"/><circle cx="716" cy="162" r="7"/></g>
  <g fill="#ffd293" opacity=".4" filter="url(#blur)"><circle cx="264" cy="204" r="30"/><circle cx="410" cy="207" r="35"/><circle cx="559" cy="172" r="30"/><circle cx="716" cy="162" r="30"/></g>

  <!-- Left bookcase, hanging greenery, framed art and miniature Ghostie. -->
  <g filter="url(#shadow)">
    <rect x="112" y="295" width="490" height="405" rx="18" fill="#372638" stroke="#755265" stroke-width="6"/>
    <path d="M130 420h454M130 545h454" stroke="#795565" stroke-width="11"/>
    <g><path d="M161 347v64m25-80v80m31-66v66m36-75v75m42-59v59m37-81v81m37-70v70m44-81v81m31-54v54m42-70v70" stroke-width="18" stroke-linecap="round" stroke="#b3849d"/><path d="M182 473v62m30-80v80m45-54v54m34-76v76m47-65v65m45-72v72m37-53v53m38-79v79m44-69v69" stroke-width="17" stroke-linecap="round" stroke="#7e6597"/></g>
    <use href="#ghost" transform="translate(454 567) scale(.8)"/>
    <rect x="158" y="583" width="109" height="80" rx="9" fill="#d6ac94"/><path d="M180 607q17-28 32 0 14-27 34 0-10 18-34 39-22-21-32-39" fill="#8b607f"/>
    <rect x="294" y="587" width="109" height="76" rx="9" fill="#a38099"/>
  </g>
  <g fill="#73917c"><path d="M173 0q39 97-13 165 65-49 38-161M483 0q-28 87 16 145-69-49-46-143M1650 0q44 99-17 200 75-75 48-200"/><path d="M190 61q39-34 53-2-33 30-57 11m-26 42q-41-20-41 17 29 21 45-5m300-47q-35-21-41 11 26 26 45-2m1220 10q46-34 57 4-36 21-57 0"/></g>

  <!-- Sofa, knit blanket, throw pillows, rug, and little coffee table. -->
  <ellipse cx="952" cy="904" rx="522" ry="104" fill="#ad7b83" opacity=".24"/>
  <g filter="url(#shadow)"><rect x="604" y="566" width="527" height="227" rx="64" fill="#765674"/><rect x="639" y="596" width="467" height="119" rx="32" fill="#93718c"/><rect x="591" y="652" width="553" height="111" rx="42" fill="#88647f"/><rect x="652" y="744" width="27" height="86" rx="8" fill="#46313e"/><rect x="1061" y="744" width="27" height="86" rx="8" fill="#46313e"/>
    <path d="M781 643q63 4 139-14v128q-36 38-127 34Z" fill="#cda8c3"/><path d="M798 685h110m-112 37h110m-110 35h102" stroke="#eee0df" stroke-opacity=".4" stroke-width="5"/>
    <rect x="661" y="608" width="105" height="92" rx="24" fill="#cc9996" transform="rotate(-8 714 654)"/><rect x="961" y="607" width="115" height="94" rx="25" fill="#d9bc9d" transform="rotate(7 1018 654)"/>
  </g>
  <g filter="url(#shadow)"><ellipse cx="1190" cy="857" rx="180" ry="58" fill="#5e4044"/><rect x="1027" y="811" width="326" height="47" rx="22" fill="#825858"/><path d="M1061 850v71m252-71v71" stroke="#4c3035" stroke-width="15" stroke-linecap="round"/><rect x="1092" y="750" width="63" height="64" rx="12" fill="#8f668b"/><path d="M1154 765q27 0 27 17t-27 17" fill="none" stroke="#8f668b" stroke-width="9"/><path d="M1112 730q-12-17 2-37m20 37q-12-17 2-37" fill="none" stroke="#ecd4d0" stroke-opacity=".7" stroke-width="4"/>
    <path d="M1252 813v-84m21 83 8-108m23 108 19-92" stroke="#799279" stroke-width="7"/><g fill="#a080bd"><ellipse cx="1269" cy="696" rx="8" ry="17"/><ellipse cx="1297" cy="702" rx="8" ry="18"/><ellipse cx="1316" cy="714" rx="8" ry="16"/></g>
  </g>

  <!-- Reading lamp and warm light pool. -->
  <ellipse cx="1635" cy="501" rx="285" ry="363" fill="url(#lamp)"/>
  <path d="M1612 801V313m-51 487h103m-62-489q43-71 95-9" fill="none" stroke="#c99c74" stroke-width="11" stroke-linecap="round"/>
  <path d="M1572 281h178l-34 102h-112Z" fill="#d3a77f"/><ellipse cx="1661" cy="383" rx="52" ry="12" fill="#ffe1ad"/>
  <g fill="#f4d49d" opacity=".75"><use href="#star" transform="translate(715 311)"/><use href="#star" transform="translate(1538 468) scale(.72)"/><use href="#star" transform="translate(1400 132) scale(.8)"/></g>
  <use href="#ghost" transform="translate(1519 652) scale(.86)"/>
</svg>
