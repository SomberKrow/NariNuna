<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
  <title id="title">Resources helper ghostie</title>
  <desc id="desc">A friendly floating helper ghostie with round glasses, a little satchel, clipboard, bookmark and magical resource wisps.</desc>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FFFFFF"/><stop offset=".62" stop-color="#F3EDFF"/><stop offset="1" stop-color="#D7C8FF"/></linearGradient>
    <linearGradient id="hood" x1="0" x2="1"><stop stop-color="#241B2F"/><stop offset="1" stop-color="#3A2C4C"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>
  <ellipse cx="445" cy="470" rx="310" ry="330" fill="#A88CF2" opacity=".10" filter="url(#glow)"/>

  <!-- tail -->
  <path d="M442 692c-10 62 30 90 3 144 65-24 103-68 106-115 4-56-48-80-109-29z" fill="url(#body)" stroke="#241B2F" stroke-width="12" stroke-linejoin="round"/>

  <!-- main body -->
  <path d="M258 340c13-151 134-238 245-215 122 25 191 130 166 282-14 87-23 176 13 251-80 65-180 97-286 70-132-34-190-145-174-255 7-49 31-90 36-133z" fill="url(#body)" stroke="#241B2F" stroke-width="13"/>

  <!-- hood -->
  <path d="M267 343c14-148 121-242 249-225 101 14 176 94 170 193-40-45-81-75-132-86-91-20-169 24-223 103-21 31-38 67-52 110-14-31-18-61-12-95z" fill="url(#hood)" stroke="#241B2F" stroke-width="13" stroke-linejoin="round"/>
  <path d="M293 216c31-53 104-104 171-105-43 27-73 55-95 93" fill="none" stroke="#A88CF2" stroke-width="12" stroke-linecap="round"/>
  <path d="M544 139c56 2 112 29 149 76-43-19-80-20-114-12" fill="none" stroke="#A88CF2" stroke-width="12" stroke-linecap="round"/>

  <!-- face -->
  <g stroke="#241B2F" stroke-width="9">
    <circle cx="386" cy="397" r="74" fill="#F6F1FF"/>
    <circle cx="541" cy="397" r="74" fill="#F6F1FF"/>
    <path d="M460 390h8"/>
    <circle cx="393" cy="402" r="26" fill="#241B2F"/>
    <circle cx="548" cy="402" r="26" fill="#241B2F"/>
    <circle cx="400" cy="392" r="8" fill="#FFFFFF" stroke="none"/>
    <circle cx="555" cy="392" r="8" fill="#FFFFFF" stroke="none"/>
    <path d="M431 463q33 34 66 0" fill="none" stroke-linecap="round"/>
  </g>
  <!-- glasses bridge and arms -->
  <path d="M452 392h22M314 385l-57-21M615 385l58-22" fill="none" stroke="#F1B65D" stroke-width="10" stroke-linecap="round"/>

  <!-- little lavender pin -->
  <g transform="translate(565 228) rotate(14)" stroke="#8DAA91" stroke-width="5" stroke-linecap="round">
    <path d="M12 82C2 56 5 27 11 0"/>
    <g fill="#7A5AC8" stroke="none"><ellipse cx="8" cy="12" rx="8" ry="13"/><ellipse cx="16" cy="28" rx="8" ry="13"/><ellipse cx="8" cy="43" rx="8" ry="13"/><ellipse cx="16" cy="58" rx="8" ry="13"/></g>
  </g>

  <!-- clipboard -->
  <g transform="translate(511 492) rotate(8 110 130)" stroke="#241B2F" stroke-width="10" stroke-linejoin="round">
    <rect x="0" y="0" width="220" height="270" rx="22" fill="#6A4A3B"/>
    <rect x="22" y="34" width="176" height="212" rx="10" fill="#FFF7E8"/>
    <path d="M70 0h80q18 0 18 18v32H52V18Q52 0 70 0z" fill="#F1B65D"/>
    <g fill="none" stroke="#5B3A7A" stroke-width="7" stroke-linecap="round">
      <path d="M58 82l12 12 22-27M105 83h55"/><path d="M58 128l12 12 22-27M105 129h61"/><path d="M58 174l12 12 22-27M105 175h48"/>
    </g>
    <path d="M105 211c-13-11-31 6-11 23l11 9 11-9c20-17 2-34-11-23z" fill="#ECA4C7" stroke="none"/>
  </g>

  <!-- raised arm -->
  <path d="M646 430c71-17 103-55 118-93 10-24 45-16 42 11-7 66-65 136-139 159" fill="url(#body)" stroke="#241B2F" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- pointer card -->
  <g transform="translate(718 238) rotate(8 85 95)" stroke="#241B2F" stroke-width="9" stroke-linejoin="round">
    <rect x="0" y="0" width="160" height="184" rx="14" fill="#FFF7E8"/>
    <path d="M29 54h100M29 85h74M29 116h112" stroke="#5B3A7A" stroke-width="7" stroke-linecap="round"/>
    <path d="M76 139c-13-11-31 6-11 23l11 9 11-9c20-17 2-34-11-23z" fill="#ECA4C7" stroke="none"/>
    <path d="M132 8l8 17 17 8-17 8-8 17-8-17-17-8 17-8z" fill="#F1B65D" stroke="none"/>
  </g>

  <!-- satchel -->
  <g transform="translate(175 542) rotate(-8 125 100)" stroke="#241B2F" stroke-width="10" stroke-linejoin="round">
    <path d="M50 40h160q24 0 24 24v135q0 24-24 24H50q-24 0-24-24V64q0-24 24-24z" fill="#6A4A3B"/>
    <path d="M38 88h184l-18 70H56z" fill="#8A624D"/>
    <path d="M102 33c2-54 82-54 84 0" fill="none"/>
    <circle cx="130" cy="130" r="15" fill="#F1B65D"/>
    <path d="M33 185h194" opacity=".35"/>
  </g>
  <path d="M335 293c-66 70-87 188-64 292" fill="none" stroke="#F1B65D" stroke-width="14" stroke-linecap="round" opacity=".85"/>

  <!-- bookmark -->
  <path d="M180 512l48 4-9 97-18-21-22 17z" fill="#A88CF2" stroke="#241B2F" stroke-width="8" stroke-linejoin="round"/>

  <!-- wisps & stars -->
  <g fill="#D7C8FF" stroke="#7A5AC8" stroke-width="7">
    <g transform="translate(85 340) scale(.7)"><path d="M0 60C-4 17 31-9 64 12c26 16 24 47 4 68 8 22 0 48-28 72 8-35-34-37-31-71-10-5-11-12-9-21z"/><circle cx="26" cy="49" r="5" fill="#241B2F" stroke="none"/><circle cx="46" cy="49" r="5" fill="#241B2F" stroke="none"/></g>
    <g transform="translate(735 600) scale(.6)"><path d="M0 60C-4 17 31-9 64 12c26 16 24 47 4 68 8 22 0 48-28 72 8-35-34-37-31-71-10-5-11-12-9-21z"/><circle cx="26" cy="49" r="5" fill="#241B2F" stroke="none"/><circle cx="46" cy="49" r="5" fill="#241B2F" stroke="none"/></g>
  </g>
  <g fill="#F1B65D"><path d="M138 215l9 22 22 9-22 9-9 22-9-22-22-9 22-9z"/><path d="M760 516l7 17 17 7-17 7-7 17-7-17-17-7 17-7z"/></g>
</svg>
