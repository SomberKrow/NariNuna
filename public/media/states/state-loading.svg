<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title desc"><title id="title">Loading</title><desc id="desc">Floating ghostie with three animated soul-flame loading dots.</desc><defs>
<linearGradient id="ghostFill" x1="0" y1="0" x2=".85" y2="1"><stop offset="0" stop-color="#FFF8F0"/><stop offset=".72" stop-color="#F7ECFF"/><stop offset="1" stop-color="#C9B8FF"/></linearGradient>
<linearGradient id="mintGlow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#89E6D6"/><stop offset="1" stop-color="#43C89D"/></linearGradient>
<filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#2B2440" flood-opacity=".16"/></filter>
<filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>.ink{stroke:#2B2440;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:#2B2440;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.tiny{stroke:#2B2440;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.nf{fill:none}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
</defs><style>#ghost{animation:bob 2.8s ease-in-out infinite;transform-origin:256px 280px}.d1{animation:pulse 1.2s ease-in-out infinite}.d2{animation:pulse 1.2s ease-in-out infinite .18s}.d3{animation:pulse 1.2s ease-in-out infinite .36s}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}</style><g id="ghost"><g filter="url(#shadow)"><path d="M256 151C186 151 144 203 150 279c4 48 28 76 51 95-12 18-19 38-10 49 15 18 37 1 53-17 11 21 28 39 44 32 18-8 14-30 9-46 25-13 55-44 64-90 15-74-32-151-105-151Z" fill="url(#ghostFill)" class="ink"/><path d="M184 276q-22 12-20 38 17-8 30-22" fill="#F7ECFF" class="thin"/><path d="M328 276q22 12 20 38-17-8-30-22" fill="#F7ECFF" class="thin"/><ellipse cx="207" cy="263" rx="18" ry="10" fill="#F1A9B8" opacity=".58"/><ellipse cx="305" cy="263" rx="18" ry="10" fill="#F1A9B8" opacity=".58"/><ellipse cx="220" cy="230" rx="15" ry="20" fill="#2B2440"/><ellipse cx="292" cy="230" rx="15" ry="20" fill="#2B2440"/><path d="M246 270Q256 278 266 270" class="thin nf"/><g transform="translate(0,-8)"><path d="M165 172q45-54 84-92 35 37 67 87-45-21-151 5Z" fill="#2B2440" class="tiny"/><path d="M158 172q84-27 179 4-44 22-148 16-22-4-31-20Z" fill="#2B2440" class="tiny"/><path d="M210 143q35-11 76 2" class="thin nf" stroke="#F2C76B"/><circle cx="294" cy="145" r="11" fill="#89E6D6" class="tiny"/></g><g transform="translate(0,6)"><path d="M246 309c-28-25-47-17-42 8 4 20 24 22 46 4Z" fill="#2B2440" class="tiny"/><path d="M266 309c28-25 47-17 42 8-4 20-24 22-46 4Z" fill="#2B2440" class="tiny"/><circle cx="256" cy="316" r="14" fill="#43C89D" class="tiny"/></g></g></g><g transform="translate(172 410)" filter="url(#glow)"><circle class="d1" r="11" fill="#89E6D6"/><circle class="d2" cx="84" r="11" fill="#9F8BE7"/><circle class="d3" cx="168" r="11" fill="#F2C76B"/></g></svg>
