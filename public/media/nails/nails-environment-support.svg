<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Nails environment support</title><desc id="desc">Warm lavender manicure environment support illustration with nail polish, candles, and a small ghostie.</desc>
<defs>
<linearGradient id="warmGlow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe6bc"/><stop offset="1" stop-color="#be82c8"/></linearGradient>
<linearGradient id="purpleGlass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d7b9ff" stop-opacity=".9"/><stop offset=".45" stop-color="#8f5cc7"/><stop offset="1" stop-color="#4b2f64"/></linearGradient>
<linearGradient id="cloth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b89ad9"/><stop offset="1" stop-color="#76599a"/></linearGradient>
<filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="14" result="blur"/><feOffset in="blur" dx="0" dy="12" result="off"/><feFlood flood-color="#23172e" flood-opacity=".28" result="flood"/><feComposite in="flood" in2="off" operator="in" result="shadow"/><feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
