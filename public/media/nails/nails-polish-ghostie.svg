<path d="M560 555q120-25 165 25q22 28 0 85q-22 52-115 65q-80 11-120-20q-28-22-10-70q18-50 80-85Z" fill="#f0d1c5" stroke="#ad8a81" stroke-width="6"/><path d="M598 582q88-19 103 13q12 30-13 64q-26 36-83 35q-48 0-68-22q-16-20-5-47q13-31 66-43Z" fill="url(#purpleGlass)"/>
<circle cx="212" cy="566" r="14" fill="#a068ca"/><circle cx="242" cy="595" r="10" fill="#d0a8ef"/><circle cx="690" cy="265" r="8" fill="#d7a44a"/><path d="M704 240l8 20 20 8-20 8-8 20-8-20-20-8 20-8z" fill="#d7a44a"/>
</g>
