<path d="M245 185Q300 42 440 42t195 143q-35 30-93 36H340q-60-6-95-36Z" fill="#7f5a9d"/>
<rect x="250" y="167" width="380" height="92" rx="40" fill="#8f69ad"/><path d="M294 193h292" stroke="#b796d0" stroke-width="10" stroke-linecap="round" opacity=".6"/>
<circle cx="368" cy="360" r="22" fill="#24182f"/><circle cx="514" cy="360" r="22" fill="#24182f"/>
<ellipse cx="333" cy="414" rx="36" ry="17" fill="#e9a7c5" opacity=".45"/><ellipse cx="550" cy="414" rx="36" ry="17" fill="#e9a7c5" opacity=".45"/>
<path d="M395 431q46 30 92 0" stroke="#b76f91" stroke-width="11" fill="none" stroke-linecap="round"/>
